<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --bg: #f4f2f0;
    --panel: #ffffff;
    --panel-2: #fafafa;
    --ink: #26221f;
    --ink-dim: #6b6560;
    --ink-faint: #9b948c;
    --line: #e8e4df;
    --red: #cf2e2e;
    --red-dark: #a92222;
    --sidebar-active: #ececec;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --card-orange-1:#f7a94a; --card-orange-2:#f08a2a;
    --card-blue-1:#4ec3e0; --card-blue-2:#1f8fc4;
    --card-green-1:#8fc23e; --card-green-2:#4f9130;
    --sage:#2f8f5b; --card-pink-1:#e2437a; --card-pink-2:#c22357;
  }
  [data-theme="dark"]{
    --bg: #15130f;
    --panel: #1e1a15;
    --panel-2: #241f19;
    --ink: #f1e9de;
    --ink-dim: #b3a999;
    --ink-faint: #7d7364;
    --line: #332b21;
    --sidebar-active: #2a241d;
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    transition: background .25s ease, color .25s ease;
  }

  /* global interaction polish */
  button, .link-btn, .btn-mini, .btn-save, .btn-pay, .btn-add, .btn-update,
  .nav-item, .sub-item, .stat-card, .table-cell, .plain-table-cell, .sm-pill,
  .product-card, .mp-chip, .order-type-card, .pp-method, .tab, .region-tab,
  .sm-switch-btn, .cat-item, .chart-card{
    transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  button:active, .btn-mini:active, .btn-save:active, .btn-pay:active, .btn-add:active,
  .sm-pill:active, .plain-table-cell:active, .mp-chip:active, .order-type-card:active{
    transform: scale(0.98);
  }
  .stat-card:hover, .chart-card:hover{ box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
  [data-theme="dark"] .stat-card:hover, [data-theme="dark"] .chart-card:hover{ box-shadow: 0 4px 14px rgba(0,0,0,0.35); }

  /* eye-comfort toggle */
  .eye-toggle{
    position: fixed; top: 14px; right: 14px; z-index: 500;
    display:flex; align-items:center; gap:8px;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 7px 12px 7px 10px;
    border-radius: 999px;
    box-shadow: var(--shadow);
    cursor: pointer;
    font-size: 13px;
    color: var(--ink-dim);
    user-select: none;
  }
  .eye-toggle .icon{ font-size: 15px; line-height:1; }
  .eye-toggle .track{
    width: 34px; height: 18px; border-radius: 999px;
    background: var(--line); position: relative; transition: background .2s;
  }
  .eye-toggle .knob{
    position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
    background: var(--red); transition: left .2s;
  }
  [data-theme="dark"] .eye-toggle .track{ background: #3a3226; }
  [data-theme="dark"] .eye-toggle .knob{ left: 18px; }

  /* app shell */
  .app{
    display:flex;
    min-height: 100vh;
  }

  /* sidebar */
  .sidebar{
    width: 276px; flex-shrink:0; background: var(--panel); border-right: 1px solid var(--line);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh; align-self:flex-start; overflow:hidden;
  }
  .sb-top{ padding:16px 14px 12px; border-bottom:1px solid var(--line); flex-shrink:0; }
  .brand{ display:flex; align-items:center; gap:12px; padding:0 6px 12px; }
  .brand .name{ font-weight:800; font-size:1.05rem; letter-spacing:.02em; line-height:1.1; }
  .brand-sub{ padding:0; margin:0; border:0; display:block; color:var(--ink-faint); font-size:.78rem; }
  .brand-sub .name-inline{ padding:0; }
  .editable-inline{
    border: none; background: transparent; color: var(--ink-faint);
    font-family: inherit; font-size: 0.78rem; letter-spacing: .02em;
    padding: 3px 4px; border-radius: 4px; outline: none;
  }
  .editable-inline:hover{ background: var(--panel-2); }
  .editable-inline:focus{ background: var(--panel-2); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .name-inline{ width: 100%; font-weight:700; }
  .cust-lock{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer; font-family:inherit; color:var(--ink);
    padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--panel-2);
  }
  .cust-lock:hover{ border-color:var(--ink-faint); }
  .cust-lock .cl-ic{ font-size:20px; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:#fdecc8; flex-shrink:0; }
  .cust-lock .cl-tx{ flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.25; }
  .cust-lock .cl-tx b{ font-size:.82rem; }
  .cust-lock .cl-tx small{ font-size:.72rem; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cust-lock .cl-act{ font-size:.72rem; font-weight:800; color:var(--red); }
  .cust-lock.on{ border-color:#7cc99a; }
  .cust-lock.on .cl-ic{ background:#d6f2e1; }
  .sb-nav{ flex:1; overflow-y:auto; padding:6px 10px 10px; }
  .nav-label{ display:flex; align-items:center; justify-content:space-between; font-size:.72rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); padding:10px 12px; margin:3px 0; border-radius:10px; cursor:pointer; user-select:none; }
  .nav-label:hover{ background:var(--panel-2); color:var(--ink); }
  .nav-label .chev{ font-size:11px; color:var(--ink-faint); transition:transform .15s; }
  .nav-acc.open > .nav-label{ color:var(--ink); }
  .nav-acc.open > .nav-label .chev{ transform:rotate(180deg); }
  .nav-accbody{ display:none; padding:0 0 4px 6px; border-left:2px solid var(--line); margin:0 0 6px 14px; }
  .nav-acc.open > .nav-accbody{ display:block; }
  .nav-accbody .nav-item.active::before{ left:-8px; }
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:8px 12px; margin:1px 0; border-radius:10px; cursor:pointer;
    color:var(--ink); font-weight:600; font-size:.9rem; position:relative; line-height:1.2;
  }
  .nav-item:hover{ background: var(--panel-2); }
  .nav-item.active{ background: color-mix(in srgb, var(--red) 11%, transparent); color:var(--red-dark); font-weight:800; }
  [data-theme="dark"] .nav-item.active{ color:#ffb3b3; }
  .nav-item.active::before{ content:""; position:absolute; left:-10px; top:8px; bottom:8px; width:4px; border-radius:0 4px 4px 0; background:var(--red); }
  .nav-item .ic{ font-size:16px; width:22px; text-align:center; flex-shrink:0; }
  .nav-item .nb{ margin-left:auto; display:none; min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:var(--red); color:#fff; font-size:.72rem; font-weight:800; align-items:center; justify-content:center; }
  .nav-item .nb.on{ display:flex; }
  .nav-fold > .nav-item .chev{ margin-left:auto; color:var(--ink-faint); font-size:11px; transition:transform .15s; }
  .nav-fold.open > .nav-item .chev{ transform:rotate(180deg); }
  .nav-fold > .nav-item{ color:var(--ink-dim); }
  .nav-sub{ display:none; margin:0 0 4px 21px; padding-left:8px; border-left:2px solid var(--line); }
  .nav-fold.open > .nav-sub{ display:block; }
  .nav-sub .nav-item{ font-size:.85rem; padding:7px 10px; font-weight:600; color:var(--ink-dim); }
  .nav-sub .nav-item.active{ color:var(--red-dark); }
  .nav-sub .nav-item.active::before{ left:-10px; top:6px; bottom:6px; }
  .sb-foot{ flex-shrink:0; display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--line); background:var(--panel); }
  .sb-foot .av{ width:34px; height:34px; border-radius:50%; background:var(--red); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sb-foot .who{ flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.2; }
  .sb-foot .who b{ font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sb-foot .who small{ font-size:.72rem; color:var(--ink-faint); }
  .sb-foot button{ border:1px solid var(--line); background:var(--panel-2); color:var(--ink); border-radius:9px; height:34px; padding:0 12px; cursor:pointer; font-size:.8rem; font-weight:700; font-family:inherit; }
  .sb-foot button:hover{ background:var(--sidebar-active); }
  /* müşteri ekranı şifre kapısı */
  #custGate{ position:fixed; inset:0; z-index:1500; display:none; align-items:center; justify-content:center; padding:20px; background:var(--bg); }
  #custGate.show{ display:flex; }
  #custGate .cg-box{ width:100%; max-width:360px; text-align:center; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:20px; padding:26px 22px; box-shadow:0 18px 50px rgba(0,0,0,.14); }
  #custGate .cg-logo{ width:min(190px,60vw); margin:0 auto 12px; }
  #custGate .cg-logo svg{ width:100%; height:auto; display:block; }
  #custGate h2{ margin:4px 0 4px; font-size:1.15rem; }
  #custGate p{ margin:0 0 14px; font-size:.85rem; color:var(--ink-dim); }
  #custGate input{ width:100%; box-sizing:border-box; text-align:center; letter-spacing:.12em; font-size:1.15rem; padding:13px; border:1px solid var(--line); border-radius:12px; background:var(--panel-2); color:var(--ink); font-family:inherit; }
  #custGate button.go{ width:100%; margin-top:10px; padding:13px; border:0; border-radius:12px; background:var(--red); color:#fff; font-weight:800; font-size:1rem; cursor:pointer; font-family:inherit; }
  #custGate .cg-err{ min-height:16px; margin-top:8px; font-size:.82rem; color:var(--red); }


  /* ciro takibi */
  .ct-bar{ --ct-bar:#cf2e2e; --ct-bar-dim:#e9a3a3; }
  [data-theme="dark"] .ct-bar{ --ct-bar:#ff7a7a; --ct-bar-dim:#7a3b3b; }
  .ct-pills{ display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 12px; }
  .ct-pill{ border:1px solid var(--line); background:var(--panel-2); color:var(--ink); border-radius:999px; padding:7px 13px; font-size:.82rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .ct-pill:hover{ border-color:var(--ink-faint); }
  .ct-pill.on{ background:var(--red); border-color:var(--red); color:#fff; }
  .ct-range{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px; }
  .ct-range label{ display:flex; flex-direction:column; gap:3px; font-size:.74rem; font-weight:700; color:var(--ink-dim); }
  .ct-range input[type=date]{ border:1px solid var(--line); background:var(--panel-2); color:var(--ink); border-radius:8px; padding:8px 10px; font-family:inherit; font-size:.9rem; }
  .ct-seg{ display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-left:auto; }
  .ct-seg button{ border:0; background:var(--panel-2); color:var(--ink-dim); padding:9px 14px; font-size:.82rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .ct-seg button + button{ border-left:1px solid var(--line); }
  .ct-seg button.on{ background:var(--ink); color:var(--panel); }
  .ct-kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:14px 0; }
  .ct-kpi{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .ct-kpi small{ display:block; color:var(--ink-dim); font-size:.76rem; font-weight:700; }
  .ct-kpi b{ display:block; font-size:1.35rem; margin-top:3px; font-variant-numeric:tabular-nums; }
  .ct-kpi.main{ grid-column:span 2; border-color:var(--red); }
  .ct-kpi.main b{ font-size:1.9rem; }
  .ct-kpi em{ display:block; font-style:normal; font-size:.76rem; margin-top:3px; color:var(--ink-faint); }
  .ct-kpi em.up{ color:#1f8a4c; } .ct-kpi em.dn{ color:#c0392b; }
  .ct-chart{ position:relative; }
  .ct-chart svg{ width:100%; height:auto; display:block; overflow:visible; }
  .ct-tip{ position:absolute; pointer-events:none; z-index:5; background:var(--ink); color:var(--panel); border-radius:10px; padding:8px 11px; font-size:.78rem; line-height:1.45; white-space:nowrap; display:none; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  .ct-tip b{ display:block; margin-bottom:2px; }
  .ct-tablewrap{ overflow-x:auto; max-height:460px; overflow-y:auto; }
  .ct-table{ width:100%; border-collapse:collapse; font-size:.86rem; font-variant-numeric:tabular-nums; }
  .ct-table th, .ct-table td{ padding:9px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  .ct-table th:first-child, .ct-table td:first-child{ text-align:left; }
  .ct-table thead th{ position:sticky; top:0; background:var(--panel); color:var(--ink-dim); font-size:.74rem; text-transform:uppercase; letter-spacing:.04em; }
  .ct-table tfoot td{ font-weight:800; position:sticky; bottom:0; background:var(--panel-2); }
  .ct-table td.zero{ color:var(--ink-faint); }
  .ct-empty{ padding:28px 10px; text-align:center; color:var(--ink-faint); }

  /* main */
  .main{ flex:1; min-width:0; }
  .topbar{
    display:flex; align-items:center; gap:16px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .topbar .title{ font-weight:800; font-size:1.05rem; }
  .topbar .spacer{ flex:1; }
  .topbar .tb-ic{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background: var(--panel-2); font-size:15px; color: var(--ink-dim);
  }
  .content{ padding: 26px 28px 60px; max-width: 1160px; }

  /* screens */
  .screen{ display:none; }
  .screen.show{ display:block; }

  /* home cards */
  .stat-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:16px; }
  .stat-card{
    display:flex; align-items:flex-start; gap:18px;
    background: var(--panel);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 20px 22px;
  }
  .stat-card .swatch{
    width:52px; height:52px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    font-size:21px; color:#fff; flex-shrink:0;
  }
  .stat-card .info{ flex:1; min-width:0; text-align:right; }
  .stat-card .label{ color: var(--ink-dim); font-size:0.85rem; margin-bottom:8px; }
  .stat-card .value{ font-size:1.6rem; font-weight:800; }
  .stat-card .foot{ color: var(--ink-faint); font-size:0.78rem; margin-top:10px; padding-top:9px; border-top:1px solid var(--line); }
  @media (max-width: 900px){ .stat-grid{ grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px){ .stat-grid{ grid-template-columns: 1fr; } }
  .sw-1{ background: linear-gradient(145deg,var(--card-orange-1),var(--card-orange-2)); }
  .sw-2{ background: linear-gradient(145deg,var(--card-blue-1),var(--card-blue-2)); }
  .sw-3{ background: linear-gradient(145deg,var(--card-green-1),var(--card-green-2)); }
  .sw-4{ background: linear-gradient(145deg,var(--card-pink-1),var(--card-pink-2)); }

  /* settings tabs */
  .settings-card{
    background: var(--panel); border-radius: 12px; box-shadow: var(--shadow);
    padding: 24px; margin-bottom: 20px;
  }
  .settings-head{ display:flex; align-items:flex-start; gap:16px; margin-bottom:20px; }
  .settings-head .icn{
    width:52px;height:52px;border-radius:10px;
    background: linear-gradient(145deg,var(--card-orange-1),var(--card-orange-2));
    display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0;
  }
  .settings-head h2{ margin:0 0 4px; font-size:1.15rem; }
  .settings-head p{ margin:0; color: var(--ink-faint); font-size:0.85rem; }
  .btn-update{
    margin-left:auto; background: var(--red); color:#fff; border:none;
    padding: 9px 16px; border-radius:8px; font-weight:700; font-size:0.85rem;
    cursor:pointer; white-space:nowrap;
  }
  .tabs{ display:flex; gap:22px; border-bottom:1px solid var(--line); margin-bottom:20px; }
  .tab{
    padding-bottom:10px; color: var(--ink-faint); font-weight:700; font-size:0.9rem;
    cursor:pointer; border-bottom:2px solid transparent;
  }
  .tab.active{ color: var(--red); border-color: var(--red); }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:0.82rem; color: var(--ink-faint); margin-bottom:6px; }
  .field .val{ font-weight:700; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .field-row{ display:flex; gap:24px; }
  .field-row .field{ flex:1; }
  .toggle-row{
    display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);
  }
  .toggle-row:last-child{ border-bottom:none; }
  .mini-toggle{ width:40px;height:22px;border-radius:999px; position:relative; }
  .mini-toggle.on{ background: var(--red); }
  .mini-toggle.off{ background: var(--line); }
  .mini-toggle .k{ position:absolute; top:2px; width:18px;height:18px;border-radius:50%; background:#fff; }
  .mini-toggle.on .k{ right:2px; }
  .mini-toggle.off .k{ left:2px; }
  .toggle-row .name{ font-weight:700; font-size:0.9rem; }
  .toggle-row .pay-name{ cursor:text; padding:2px 4px; border-radius:4px; outline:none; }
  .toggle-row .pay-name:hover{ background: var(--panel-2); }
  .toggle-row .pay-name:focus{ background: var(--panel-2); box-shadow: 0 0 0 1px var(--red); }
  .toggle-row .pay-edit-hint{ margin-left:6px; color: var(--ink-faint); font-size:12px; }

  /* users form */
  .modal-card{
    background: var(--panel); border-radius:12px; box-shadow: var(--shadow); padding:26px;
    max-width: 620px;
  }
  .modal-card h2{ margin:0 0 4px; }
  .modal-card p.sub{ margin:0 0 22px; color: var(--ink-faint); font-size:0.85rem; }
  .modal-card .field select, .modal-card .field input{
    width:100%; border:none; border-bottom:1px solid var(--line); background:transparent;
    color: var(--ink); font-family:inherit; font-size:0.95rem; padding:6px 0; font-weight:700;
  }
  .btn-add{
    background: var(--red); color:#fff; border:none; padding:11px 22px; border-radius:8px;
    font-weight:700; cursor:pointer; float:right;
  }

  /* permissions table */
  .perm-table{ background: var(--panel); border-radius:12px; box-shadow: var(--shadow); overflow:hidden; }
  .perm-search{ padding:16px 20px; border-bottom:1px solid var(--line); color: var(--ink-faint); font-size:0.85rem; }
  .perm-group-head{
    display:grid; grid-template-columns: 1fr repeat(5, 70px);
    background: var(--panel-2); font-size:0.78rem; font-weight:800; color: var(--ink-dim);
    padding: 10px 20px;
  }
  .perm-row{
    display:grid; grid-template-columns: 1fr repeat(5, 70px);
    align-items:center; padding: 14px 20px; border-top:1px solid var(--line); gap: 6px;
  }
  .perm-row .desc b{ display:block; font-size:0.9rem; }
  .perm-row .desc span{ color: var(--ink-faint); font-size:0.78rem; }
  .chk{ width:18px;height:18px;border-radius:4px; border:1.5px solid var(--line); margin: 0 auto; display:flex;align-items:center;justify-content:center; font-size:12px; color:#fff; }
  .chk.on{ background: var(--red); border-color: var(--red); }

  /* tables / salon grid */
  .table-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr));
    gap:14px;
  }
  .table-cell{
    background: var(--panel); border-radius:12px; box-shadow: var(--shadow);
    padding: 18px 12px; text-align:center; cursor:pointer; font-weight:700;
    border: 2px solid transparent;
  }
  .table-cell:hover{ border-color: var(--red); }
  .table-cell .dot{ width:9px;height:9px;border-radius:50%; margin: 0 auto 8px; }
  .table-cell.empty .dot{ background:#9b948c; }
  .table-cell.busy .dot{ background: var(--red); }
  .table-cell .sum{ font-size:0.72rem; color: var(--ink-faint); font-weight:600; margin-top:4px; }

  /* generic panel used by every new screen */
  .panel-card{ background: var(--panel); border-radius:12px; box-shadow: var(--shadow); padding:22px 24px; margin-bottom:18px; }
  .panel-head{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .panel-head .pi{ width:44px;height:44px;border-radius:10px; display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff; flex-shrink:0; background: linear-gradient(145deg,var(--card-orange-1),var(--card-orange-2)); }
  .panel-head h2{ margin:0 0 2px; font-size:1.05rem; }
  .panel-head p{ margin:0; color: var(--ink-faint); font-size:0.82rem; }
  .panel-head .btn-mini{ margin-left:auto; background: var(--red); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-weight:700; font-size:0.8rem; cursor:pointer; white-space:nowrap; }

  .plist{ display:flex; flex-direction:column; }
  .prow{ display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); }
  .prow:last-child{ border-bottom:none; }
  .prow .pic{ font-size:16px; width:22px; text-align:center; color: var(--ink-faint); flex-shrink:0; }
  .prow .pmain{ flex:1; min-width:0; }
  .prow .pmain b{ display:block; font-size:0.92rem; font-weight:700; }
  .prow .pmain span{ color: var(--ink-faint); font-size:0.78rem; }
  .prow .pval{ font-weight:700; color: var(--ink); font-size:0.9rem; white-space:nowrap; }
  .prow .pval.tag{ background: var(--panel-2); padding:3px 10px; border-radius:999px; font-size:0.76rem; color: var(--ink-dim); font-weight:600; }
  .pcat{ font-weight:800; font-size:0.8rem; color: var(--red); margin: 18px 0 2px; }
  .pcat:first-child{ margin-top:0; }

  .bar-row{ display:flex; align-items:center; gap:12px; padding:9px 0; }
  .bar-row .bname{ width:120px; font-size:0.85rem; font-weight:700; flex-shrink:0; }
  .bar-row .btrack{ flex:1; background: var(--panel-2); height:10px; border-radius:6px; overflow:hidden; }
  .bar-row .bfill{ height:100%; background: var(--red); border-radius:6px; }
  .bar-row .bval{ width:64px; text-align:right; font-size:0.82rem; color: var(--ink-dim); flex-shrink:0; }

  .tile-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  .tile{ background: var(--panel); border-radius:12px; box-shadow: var(--shadow); padding:18px 20px; }
  .tile .t-label{ color: var(--ink-faint); font-size:0.8rem; margin-bottom:6px; }
  .tile .t-value{ font-size:1.35rem; font-weight:800; }

  .order-type-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:14px; }
  .order-type-card{ background: var(--panel); border-radius:12px; box-shadow: var(--shadow); padding:26px 16px; text-align:center; cursor:pointer; border:2px solid transparent; }
  .order-type-card:hover{ border-color: var(--red); }
  .order-type-card .oi{ font-size:26px; margin-bottom:10px; }
  .order-type-card b{ font-size:0.9rem; }

  .qr-box{ display:flex; align-items:center; gap:22px; }
  .qr-square{ width:96px;height:96px;border-radius:10px; background: var(--panel-2); display:flex; align-items:center; justify-content:center; font-size:38px; flex-shrink:0; }
  .qr-box p{ margin:0; color: var(--ink-dim); font-size:0.88rem; max-width:32ch; }

  /* order ticket */
  .ticket-screen .tb-dark{
    background:#1b1b1b; color:#fff; display:flex; align-items:center; gap:18px;
    padding:14px 20px; border-radius:10px 10px 0 0; font-weight:700;
  }
  .ticket-screen .tb-dark .spacer{ flex:1; }
  .order-card{ background: var(--panel); box-shadow: var(--shadow); border-radius:0 0 10px 10px; padding:22px; }
  .order-meta{ display:flex; justify-content:space-between; color: var(--ink-dim); font-size:0.85rem; margin-bottom:18px; }
  .order-meta b{ color: #4f9130; }
  .order-line{ display:flex; align-items:center; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); }
  .order-line .qty{ font-weight:800; font-size:1.1rem; width:24px; text-align:center; color: var(--red); }
  .order-line .name{ font-weight:700; }
  .order-line .sub{ color: var(--ink-faint); font-size:0.8rem; }
  .order-line .price{ margin-left:auto; font-weight:700; color: var(--red); }
  .order-total{ display:flex; justify-content:space-between; padding-top:18px; margin-top:6px; font-weight:800; font-size:1.1rem; }
  .btn-save{ margin-top:18px; width:100%; background: var(--red); color:#fff; border:none; padding:13px; border-radius:8px; font-weight:800; cursor:pointer; }
  .order-empty{ display:none; text-align:center; color: var(--ink-faint); font-size:0.88rem; padding:22px 0; }
  .order-empty.show{ display:block; }
  .order-add-row{ display:flex; align-items:center; gap:16px; padding-top:14px; border-top:1px solid var(--line); margin-top:8px; }
  .order-add-row .btn-mini{ }
  .menu-picker{ margin-top:12px; background: var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .mp-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .mp-tab{ padding:6px 13px; border-radius:999px; font-size:0.78rem; font-weight:700; color: var(--ink-dim); background: var(--panel); border:1px solid var(--line); cursor:pointer; }
  .mp-tab.active{ background: var(--red); color:#fff; border-color: var(--red); }
  .mp-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap:10px; }
  .mp-chip{ background: var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; }
  .mp-chip:hover{ border-color: var(--red); }
  .mp-chip b{ display:block; font-size:0.84rem; margin-bottom:3px; }
  .mp-chip span{ color: var(--ink-faint); font-size:0.78rem; }
  .btn-pay{ margin-top:12px; width:100%; background: var(--sage); color:#fff; border:none; padding:13px; border-radius:8px; font-weight:800; cursor:pointer; }
  .payment-panel{ margin-top:12px; background: var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .pp-title{ font-weight:700; font-size:0.86rem; margin-bottom:12px; color: var(--ink-dim); }
  .pp-title b{ color: var(--ink); }
  .pp-methods{ display:flex; flex-wrap:wrap; gap:10px; }
  .pp-method{ flex:1 1 45%; padding:13px; border-radius:8px; border:1px solid var(--line); background: var(--panel); font-weight:700; cursor:pointer; font-size:0.88rem; color: var(--ink); }
  .pp-method:hover{ border-color: var(--sage); color: var(--sage); }
  .pp-split-row{ margin-bottom:14px; padding-bottom:14px; border-bottom:1px dashed var(--line); }
  .pp-split-row label{ display:block; font-size:0.78rem; color: var(--ink-faint); margin-bottom:6px; }
  .pp-split-controls{ display:flex; align-items:center; gap:8px; }
  .pp-split-controls input{
    width:56px; border:1px solid var(--line); background: var(--panel); border-radius:6px;
    padding:8px 8px; font-family:inherit; font-size:0.88rem; font-weight:700; color: var(--ink); text-align:center;
  }
  .pp-split-controls input:focus{ outline:none; border-color: var(--sage); }
  .pp-split-controls span{ font-size:0.82rem; color: var(--ink-dim); }
  .pp-split-controls .link-btn{ margin-left:auto; font-size:0.82rem; }
  .pp-summary{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .pp-row{ display:flex; justify-content:space-between; font-size:0.86rem; color: var(--ink-dim); }
  .pp-row b{ color: var(--ink); font-weight:700; }
  .pp-row.pp-remaining{ padding-top:8px; border-top:1px dashed var(--line); font-size:0.95rem; }
  .pp-row.pp-remaining b{ color: var(--red); font-weight:800; }
  .pp-amount-row{ margin-bottom:14px; }
  .pp-amount-row label{ display:block; font-size:0.78rem; color: var(--ink-faint); margin-bottom:5px; }
  .pp-amount-row input{
    width:100%; border:1px solid var(--line); background: var(--panel); border-radius:8px;
    padding:11px 12px; font-family:inherit; font-size:0.98rem; font-weight:700; color: var(--ink);
  }
  .pp-amount-row input:focus{ outline:none; border-color: var(--sage); }
  .pp-history{ margin-top:12px; }
  .pp-hist-item{ display:flex; justify-content:space-between; font-size:0.8rem; color: var(--ink-faint); padding:6px 0; border-top:1px solid var(--line); }
  .pp-hist-item:first-child{ border-top:none; }
  .order-line .qty-input{
    width:28px; text-align:center; font-weight:800; font-size:1.1rem; color: var(--red);
    border:none; background:transparent; font-family:inherit; -moz-appearance:textfield;
  }
  .order-line .qty-input:disabled{ opacity:1; -webkit-text-fill-color: var(--red); }
  .order-line .qty-input:not(:disabled){ border-bottom:1px solid var(--red); cursor:text; }
  .order-line .qty-input::-webkit-outer-spin-button, .order-line .qty-input::-webkit-inner-spin-button{ margin-left:4px; }

  .stat-card .foot[data-screen]{ cursor:pointer; text-decoration: underline; text-underline-offset:2px; }
  .stat-card .foot[data-screen]:hover{ color: var(--red); }

  .mini-toggle{ cursor:pointer; }
  .chk{ cursor:pointer; }
  .table-cell, .order-type-card, .tb-ic, .prow, .sub-item, .nav-item{ user-select:none; }

  /* toast feedback */
  .toast{
    position: fixed; left:50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: #1b1b1b; color:#fff; padding: 11px 20px; border-radius: 999px;
    font-size: 0.85rem; font-weight:600; box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    opacity:0; pointer-events:none; transition: opacity .25s ease, transform .25s ease;
    z-index: 600; white-space: nowrap;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  /* ---- definition-screen header card (icon + title + desc + action) ---- */
  .def-card{ background: var(--panel); border-radius:12px; box-shadow: var(--shadow); padding:22px 24px; margin-bottom:18px; }
  .def-head{ display:flex; align-items:flex-start; gap:16px; }
  .def-head .di{
    width:52px;height:52px;border-radius:10px; flex-shrink:0;
    background: linear-gradient(145deg,var(--card-orange-1),var(--card-orange-2));
    display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;
  }
  .def-head h2{ margin:0 0 6px; font-size:1.1rem; }
  .def-head p{ margin:0; color: var(--ink-faint); font-size:0.85rem; line-height:1.55; }
  .def-head p .hl{ color: var(--red); font-weight:700; }
  .def-head .btn-mini{ margin-left:auto; flex-shrink:0; }

  .link-row{ display:flex; flex-wrap:wrap; gap:22px; margin: 4px 0 2px; }
  .link-btn{
    display:flex; align-items:center; gap:7px;
    color: var(--red); font-weight:700; font-size:0.86rem; cursor:pointer; background:none; border:none; font-family:inherit; padding:0;
  }
  .link-btn:hover{ opacity:0.8; }
  .link-btn.muted{ color: var(--ink-dim); }

  .info-box{
    background: rgba(193,68,44,0.07); border:1px solid rgba(193,68,44,0.18); border-radius:10px;
    padding:16px 18px; color: var(--red); font-size:0.85rem; line-height:1.7; margin-bottom:16px;
  }
  [data-theme="dark"] .info-box{ background: rgba(193,68,44,0.12); }

  /* generic definition table (Mutfak Grupları, Müşteriler) */
  .def-table{ background: var(--panel); border-radius:12px; box-shadow: var(--shadow); overflow:hidden; }
  .def-table .dt-head{ display:flex; gap:14px; padding:12px 20px; background: var(--panel-2); font-size:0.76rem; font-weight:800; color: var(--ink-dim); }
  .def-table .dt-row{ display:flex; gap:14px; align-items:center; padding:14px 20px; border-top:1px solid var(--line); font-size:0.88rem; }
  .def-table .dt-col{ flex:1; min-width:0; }
  .def-table .dt-sort{ cursor:pointer; color: var(--red); user-select:none; }
  .def-table .dt-actions{ display:flex; gap:14px; flex-shrink:0; }
  .def-table .dt-actions .link-btn{ font-size:0.82rem; }
  .badge{ display:inline-block; background: var(--panel-2); color: var(--ink-dim); font-size:0.76rem; font-weight:700; padding:4px 10px; border-radius:999px; }

  /* category + product screen */
  .cat-layout{ display:flex; gap:0; background: var(--panel); border-radius:12px; box-shadow: var(--shadow); overflow:hidden; min-height: 420px; }
  .cat-sidebar{ width: 210px; flex-shrink:0; border-right:1px solid var(--line); }
  .cat-add{ display:flex; align-items:center; gap:8px; padding:16px 18px; color: var(--red); font-weight:700; font-size:0.88rem; cursor:pointer; border-bottom:1px solid var(--line); }
  .cat-item{ display:flex; align-items:center; gap:10px; padding:13px 18px; font-size:0.9rem; font-weight:600; cursor:pointer; position:relative; }
  .cat-item:hover{ background: var(--panel-2); }
  .cat-item.active{ background: var(--sidebar-active); }
  .cat-item .kebab{ margin-left:auto; color: var(--ink-faint); padding:2px 4px; }
  .cat-menu{
    position:absolute; z-index:50; left: 100%; top:0; margin-left:4px;
    background: var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    min-width:190px; padding:6px 0; display:none;
  }
  .cat-menu.show{ display:block; }
  .cat-menu .cm-item{ display:flex; align-items:center; gap:10px; padding:10px 16px; font-size:0.85rem; font-weight:600; color: var(--ink); cursor:pointer; white-space:nowrap; }
  .cat-menu .cm-item:hover{ background: var(--panel-2); }
  .cat-menu .cm-item.danger{ color: var(--red); }
  .cat-content{ flex:1; min-width:0; padding: 18px 22px 22px; }
  .cat-content-top{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .cat-content-top .link-btn{ margin-left:auto; }
  .cat-search-input{ border:none; border-bottom:1px solid var(--line); background:transparent; color:var(--ink); font-family:inherit; font-size:0.85rem; padding:4px 2px; width:150px; display:none; }
  .cat-search-input.show{ display:inline-block; }
  .product-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap:14px; }
  .product-card{ background: var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .product-card .pc-top{ display:flex; justify-content:space-between; color: var(--ink-faint); font-size:15px; margin-bottom:10px; }
  .product-card .pc-name{ font-weight:700; font-size:0.9rem; margin-bottom:2px; }
  .product-card .pc-portion{ color: var(--ink-faint); font-size:0.78rem; margin-bottom:8px; }
  .product-card .pc-price{ font-weight:700; font-size:0.9rem; }
  .ico{ font-size:1.15em; line-height:1; margin-right:6px; }
  .product-card .pc-ico{ font-size:1.7rem; line-height:1; margin-bottom:6px; }
  .mp-card .mi{ font-size:1.5rem; line-height:1; }
  .c-item .ci{ font-size:2rem; width:56px; text-align:center; flex:none; margin-right:10px; }

  /* masa/bölgeler region tabs + white table cards */
  .region-tabs{ display:flex; gap:26px; border-bottom:1px solid var(--line); margin: 18px 0 18px; }
  .region-tab{ padding-bottom:10px; color: var(--ink-faint); font-weight:700; font-size:0.9rem; cursor:pointer; border-bottom:2px solid transparent; }
  .region-tab.active{ color: var(--red); border-color: var(--red); }
  .plain-table-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap:14px; }
  .plain-table-cell{
    position:relative; background: var(--panel); border:1px solid var(--line); border-radius:8px;
    min-height:88px; display:flex; align-items:center; justify-content:center; text-align:center;
    font-weight:700; font-size:0.92rem; cursor:pointer; padding:10px;
  }
  .plain-table-cell:hover{ border-color: var(--red); }
  .plain-table-cell .pencil{ position:absolute; top:8px; right:10px; color: var(--red); font-size:13px; }
  .plain-table-cell .amt{ display:block; margin-top:6px; font-size:0.72rem; font-weight:600; color: var(--red); }

  /* müşteriler toolbar */
  .cust-toolbar{ display:flex; align-items:center; gap:20px; margin: 16px 0; flex-wrap:wrap; }
  .cust-search{ flex:1; min-width:180px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); padding-bottom:8px; color: var(--ink-faint); }
  .cust-search input{ border:none; background:transparent; outline:none; color: var(--ink); font-family:inherit; font-size:0.88rem; flex:1; }

  --sidebar-active:#1A2A47; --shadow:0 1px 2px rgba(0,0,0,.35);
}

/* ---------- Tipografi ---------- */
body{
  font-family:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{ font-family:inherit; }
.stat-card .value,.tile .t-value,.ct-kpi b,.ct-table,.prow .pval,.bar-row .bval,.order-total,.sm-pill .amt,.plain-table-cell .amt,.def-table{ font-variant-numeric:tabular-nums; }
.chart-card svg text{ font-family:'IBM Plex Sans',sans-serif; }

/* ---------- Erişilebilir odak ---------- */
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }

/* ---------- Kenar çubuğu: koyu kurumsal zemin ---------- */
.sidebar{
  --panel:#0F1A2C; --panel-2:#16243B; --ink:#E7ECF4; --ink-dim:#A9B6C9; --ink-faint:#74849D; --line:#22314B;
  --red:#8DB4F2; --red-dark:#FFFFFF;
  background:#0F1A2C; border-right:0;
}
[data-theme="dark"] .sidebar{ --panel:#0A1220; background:#0A1220; border-right:1px solid #1B2A44; }
.sb-top{ border-bottom:1px solid #22314B; }
.brand .name{ font-weight:600; letter-spacing:.04em; font-size:1rem; color:#fff; }
.nav-item{ border-radius:8px; font-weight:500; color:var(--ink-dim); }
.nav-item:hover{ background:rgba(255,255,255,.06); color:#fff; }
.nav-item.active{ background:rgba(141,180,242,.16); color:#fff; font-weight:600; }
.nav-item.active::before{ background:#8DB4F2; width:3px; }
.nav-label{ color:var(--ink-faint); }
.nav-item .nb{ background:#E5B04A; color:#1B1405; }
.sb-foot button:hover{ background:rgba(255,255,255,.07); }

/* ---------- Üst çubuk ---------- */
.topbar{ background:var(--panel); border-bottom:1px solid var(--line); box-shadow:none; }
.topbar .title{ font-weight:600; font-size:1.05rem; letter-spacing:-.005em; }
.eye-toggle{ border-radius:8px; box-shadow:none; }

/* ---------- Kart sistemi ---------- */
.panel-card,.tile,.chart-card,.settings-card,.def-card,.ct-kpi,.stat-card,.order-card,.payment-panel{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);
}
.stat-card:hover,.chart-card:hover{ box-shadow:0 4px 14px rgba(15,27,45,.08); }
.panel-card{ padding:0; overflow:hidden; }
.panel-card > *:not(.panel-head){ margin-left:24px; margin-right:24px; }
.panel-card > .plist,.panel-card > .ct-tablewrap,.panel-card > .ct-chart,.panel-card > .def-table{ margin-left:0; margin-right:0; }
.panel-card > *:last-child{ margin-bottom:20px; }
.panel-card > .plist:last-child,.panel-card > .ct-tablewrap:last-child{ margin-bottom:0; }
.panel-head{ padding:18px 24px; margin-bottom:16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; }
.panel-head h2{ font-size:1rem; font-weight:600; margin:0; }
.panel-head p{ color:var(--ink-dim); font-size:.84rem; margin:2px 0 0; }
.panel-head p b{ color:var(--ink); font-variant-numeric:tabular-nums; }
.panel-head .pi{
  width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  background:var(--accent-soft); color:var(--accent); filter:grayscale(1); flex-shrink:0; font-size:16px;
}
.panel-head .btn-mini{ margin-left:auto; }
.chart-card{ padding:20px 22px; }
.chart-title{ font-size:.92rem; font-weight:600; color:var(--ink); margin-bottom:14px; }

/* ---------- Özet kartları: sakin, sol hizalı, üstte durum şeridi ---------- */
.stat-grid{ gap:16px; }
.stat-card{ flex-direction:row-reverse; align-items:flex-start; gap:12px; padding:18px 20px 16px; border-top:3px solid var(--accent); }
.stat-card:has(.sw-2){ border-top-color:#0F7B8A; }
.stat-card:has(.sw-3){ border-top-color:#B7791F; }
.stat-card:has(.sw-4){ border-top-color:var(--bad); }
.stat-card .swatch{
  width:36px; height:36px; border-radius:9px; font-size:16px; background:var(--panel-2) !important; color:var(--ink-dim);
  filter:grayscale(1); border:1px solid var(--line);
}
.stat-card .info{ text-align:left; }
.stat-card .label{ color:var(--ink-dim); font-size:.82rem; font-weight:500; margin-bottom:6px; }
.stat-card .value{ font-size:1.75rem; font-weight:600; letter-spacing:-.02em; line-height:1.15; }
.stat-card .foot{ margin-top:12px; padding-top:10px; font-size:.78rem; }
.stat-card .foot[data-screen]{ color:var(--accent); text-decoration:none; font-weight:500; }
.stat-card .foot[data-screen]:hover{ text-decoration:underline; }
.tile .t-label{ font-size:.8rem; color:var(--ink-dim); }
.tile .t-value{ font-weight:600; }

/* ---------- Liste satırları (zayi, gider, vardiya, personel) ---------- */
.plist{ display:block; }
.prow{ display:flex; align-items:center; gap:14px; padding:13px 24px; border-top:1px solid var(--line); }
.prow:first-child{ border-top:0; }
.prow:hover{ background:var(--panel-2); }
.prow .pic{
  width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  background:var(--panel-2); border:1px solid var(--line); filter:grayscale(1); flex-shrink:0;
}
.prow .pmain b{ font-weight:600; font-size:.92rem; }
.prow .pmain span{ color:var(--ink-faint); font-size:.8rem; }
.prow .pval{ margin-left:auto; font-weight:600; }
.prow .pval.tag{
  background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line);
  padding:3px 10px; border-radius:6px; font-size:.78rem; font-weight:600;
}
.pcat{ color:var(--ink-faint); font-weight:600; font-size:.8rem; padding:14px 24px 6px; }

/* ---------- İlerleme çubukları ---------- */
.bar-row{ gap:14px; padding:10px 0; }
.bar-row .bname{ font-weight:500; color:var(--ink); }
.bar-row .btrack{ height:8px; background:#E8EDF4; border-radius:4px; }
[data-theme="dark"] .bar-row .btrack{ background:#1D2B45; }
.bar-row .bfill{ background:var(--accent); border-radius:4px; }
.bar-row .bval{ color:var(--ink); font-weight:600; width:80px; }

/* ---------- Tablolar ---------- */
.def-table,.ct-tablewrap{ border:0; box-shadow:none; border-radius:0; }
.def-table .dt-head,.ct-table thead th{
  background:var(--panel-2); color:var(--ink-dim); font-size:.74rem; font-weight:600; letter-spacing:.02em; text-transform:none;
  border-bottom:1px solid var(--line);
}
.def-table .dt-row{ padding:13px 24px; }
.def-table .dt-row:hover{ background:var(--panel-2); }
.ct-table th,.ct-table td{ padding:11px 16px; }
.ct-table tbody tr:hover td{ background:var(--panel-2); }
.ct-table tfoot td{ background:var(--panel-2); border-top:1px solid var(--line); }
.badge{ border-radius:6px; font-weight:600; }

/* ---------- Rapor ve filtre alanları ---------- */
.ct-bar{ --ct-bar:#1F4B8F; --ct-bar-dim:#B4C7E6; }
[data-theme="dark"] .ct-bar{ --ct-bar:#6F9CE6; --ct-bar-dim:#2C4470; }
.ct-pills{ gap:8px; }
.ct-pill{ border-radius:8px; font-weight:500; background:var(--panel); padding:7px 14px; }
.ct-pill:hover{ border-color:var(--accent); color:var(--accent); }
.ct-pill.on{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
[data-theme="dark"] .ct-pill.on{ color:#0B1322; }
.ct-seg{ border-radius:8px; background:var(--panel-2); border:1px solid var(--line); padding:3px; overflow:visible; }
.ct-seg button{ border:0 !important; border-radius:6px; background:transparent; font-weight:500; color:var(--ink-dim); padding:6px 14px; }
.ct-seg button.on{ background:var(--panel); color:var(--accent); font-weight:600; box-shadow:0 1px 2px rgba(15,27,45,.12); }
.ct-range label{ color:var(--ink-dim); font-weight:500; font-size:.8rem; }
.ct-kpis{ gap:16px; }
.ct-kpi{ padding:16px 18px; }
.ct-kpi small{ font-weight:500; }
.ct-kpi b{ font-weight:600; letter-spacing:-.015em; }
.ct-kpi.main{ border-color:var(--line); border-top:3px solid var(--accent); }
.ct-kpi em.up{ color:var(--ok); } .ct-kpi em.dn{ color:var(--bad); }
.ct-tip{ border-radius:8px; }
.cust-search,.sm-search,.cat-search-input{ border-radius:8px; }
.cust-filter{ border-radius:8px; }
.sm-switch{ border-radius:8px; background:var(--panel-2); border:1px solid var(--line); padding:3px; }
.sm-switch-btn{ border-radius:6px; font-weight:500; }
.sm-switch-btn.active,[data-theme="dark"] .sm-switch-btn.active{ background:var(--panel); color:var(--accent); font-weight:600; box-shadow:0 1px 2px rgba(15,27,45,.12); }
.tabs .tab,.region-tab,.mp-tab,.c-tab{ font-weight:500; }
.tab.active,.region-tab.active,.mp-tab.active{ color:var(--accent); border-color:var(--accent); font-weight:600; }

/* ---------- Form alanları ve etkileşimli kontroller ---------- */
:where(input[type=text],input[type=number],input[type=date],input[type=search],input[type=password],input[type=email],input[type=tel],input:not([type]),select,textarea){
  border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); padding:9px 12px;
}
:where(input,select,textarea):focus{ border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
.field label{ font-weight:500; color:var(--ink-dim); font-size:.8rem; }

/* Birincil eylemler */
.btn-mini,.btn-save,.btn-pay,.btn-add,.btn-update,#custGate button.go{
  background:var(--accent); color:#fff; border:1px solid var(--accent); border-radius:8px; font-weight:600; box-shadow:none;
}
[data-theme="dark"] .btn-mini,[data-theme="dark"] .btn-save,[data-theme="dark"] .btn-pay,[data-theme="dark"] .btn-add,[data-theme="dark"] .btn-update{ color:#0B1322; }
.btn-mini:hover,.btn-save:hover,.btn-pay:hover,.btn-add:hover,.btn-update:hover{ filter:brightness(1.1); }
.btn-pay{ background:var(--ok); border-color:var(--ok); }
.link-btn{ color:var(--accent); font-weight:500; }
.link-btn.muted{ color:var(--ink-dim); }
.del-btn,.cat-menu .cm-item.danger{ color:var(--bad); }
.del-btn:hover{ background:var(--bad-soft); }
.mini-toggle.on{ background:var(--accent); }
.chk.on{ background:var(--accent); border-color:var(--accent); }
.info-box{ background:var(--accent-soft); border:1px solid var(--accent-line); color:var(--ink); border-radius:8px; }

/* ---------- Masa, sipariş, mutfak panelleri ---------- */
.table-cell,.plain-table-cell,.product-card,.mp-chip,.order-type-card,.sm-order-card,.sm-pill,.pp-method{
  border:1px solid var(--line); border-radius:var(--r); background:var(--panel); box-shadow:var(--shadow);
}
.table-cell:hover,.plain-table-cell:hover,.product-card:hover,.mp-chip:hover,.order-type-card:hover,.sm-order-card:hover,.sm-pill:hover,.pp-method:hover{ border-color:var(--accent); }
.table-cell.empty .dot{ background:var(--ok); }
.table-cell.busy .dot{ background:#C98A1B; }
.cat-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
.sm-col-head{ font-weight:600; }
.sm-col-integ{ border-top:3px solid #0F7B8A; }
.sm-col-prep{ border-top:3px solid #C98A1B; }
.sm-col-wait{ border-top:3px solid var(--accent); }

/* ---------- Modal, bildirim ---------- */
.modal-bg{ background:rgba(15,27,45,.55); backdrop-filter:blur(2px); }
.modal-box,.modal-card{ border-radius:14px; border:1px solid var(--line); box-shadow:var(--shadow-lg); }
.modal-card h2{ font-weight:600; font-size:1.1rem; }
.toast{ background:#0F1A2C; color:#fff; border-radius:8px; box-shadow:var(--shadow-lg); font-weight:500; }

/* ---------- Mobil ---------- */
@media (max-width:720px){
  .stat-card .value{ font-size:1.45rem; }
  .panel-head{ padding:14px 16px; flex-wrap:wrap; }
  .prow,.def-table .dt-row{ padding:12px 16px; }
  .panel-card > *:not(.panel-head){ margin-left:16px; margin-right:16px; }
  .ct-kpi.main{ grid-column:span 1; }
}


/* ---------- Düzeltmeler: özet kartı yerleşimi, grafik renkleri, üst çubuk ---------- */
.stat-card{ position:relative; display:block; }
.stat-card .swatch{ position:absolute; top:16px; right:16px; font-size:15px; overflow:hidden; }
.stat-card:has(.sw-3) .swatch{ font-size:9px; letter-spacing:-1px; }
.stat-card .label{ padding-right:48px; min-height:2.6em; }
.stat-card .info{ width:100%; }
.staff-bar .mode:empty{ display:none; }
#dailySalesChart polyline{ stroke:var(--accent); stroke-width:2.25; stroke-linejoin:round; }
#dailySalesChart circle{ fill:var(--accent); r:3; stroke:var(--panel); stroke-width:1.5; }
.donut-legend .lg-item{ font-weight:500; color:var(--ink-dim); }

/* Sağ üst eylemler: sabit; çıkış yalnızca kenar çubuğunda */
#btnLogout{ display:none !important; }
.top-actions{ position:fixed !important; top:12px; right:16px; z-index:700; }
.topbar{ position:sticky; top:0; z-index:600; min-height:56px; }
.main{ min-width:0; }

/* Kenar çubuğu markası: logo, kenar çubuğunun kendi zemininde; sabit ve uyumlu */
.sidebar .brand{ padding:4px 6px 2px; }
.sidebar .sb-logo{ width:auto; height:auto; background:transparent; padding:0; border-radius:0; display:block; perspective:none; }
.sidebar .sb-logo svg{ animation:none !important; transform-style:flat; filter:none; width:auto; height:56px; max-height:none; margin:0; overflow:visible; }
.sb-top{ padding:18px 16px 16px; }
.brand-sub[hidden]{ display:none !important; }
/* Müşteri şifresi: Dijital Menü ekranında */
#screen-digitalmenu .cust-lock{ width:auto; max-width:460px; padding:12px 16px; margin-top:0; margin-bottom:16px; background:var(--panel-2); }
#screen-digitalmenu .cust-lock .cl-tx b{ font-size:.92rem; }
#screen-digitalmenu .cust-lock .cl-tx small{ font-size:.8rem; white-space:normal; }
#screen-digitalmenu .cust-lock .cl-act{ font-size:.8rem; font-weight:600; padding:6px 12px; border:1px solid var(--accent-line); border-radius:8px; background:var(--panel); }

/* CSV indirme önizlemesi */
.csvpv-bg{ position:fixed; inset:0; z-index:2000; background:rgba(15,27,45,.55); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; padding:20px; }
.csvpv{ background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-lg); width:min(860px,100%); max-height:86vh; display:flex; flex-direction:column; overflow:hidden; }
.csvpv-h{ padding:18px 22px 14px; border-bottom:1px solid var(--line); }
.csvpv-h h2{ margin:0; font-size:1.05rem; font-weight:600; }
.csvpv-h p{ margin:3px 0 0; color:var(--ink-dim); font-size:.84rem; font-variant-numeric:tabular-nums; }
.csvpv-t{ overflow:auto; flex:1; min-height:80px; }
.csvpv-t table{ width:100%; border-collapse:collapse; font-size:.84rem; font-variant-numeric:tabular-nums; }
.csvpv-t th,.csvpv-t td{ padding:9px 16px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
.csvpv-t th{ position:sticky; top:0; background:var(--panel-2); color:var(--ink-dim); font-weight:600; font-size:.76rem; }
.csvpv-t tbody tr:hover td{ background:var(--panel-2); }
.csvpv-e{ padding:36px 22px; text-align:center; color:var(--ink-dim); }
.csvpv-n{ padding:0 22px; color:var(--ink-faint); font-size:.78rem; }
.csvpv-n:not(:empty){ padding-top:10px; }
.csvpv-b{ display:flex; justify-content:flex-end; gap:10px; padding:14px 22px; border-top:1px solid var(--line); }
.csvpv-b button{ border-radius:8px; padding:9px 18px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--ink); }
.csvpv-b .csvpv-ok{ background:var(--accent); border-color:var(--accent); color:#fff; }
[data-theme="dark"] .csvpv-b .csvpv-ok{ color:#0B1322; }

/* ---------- Stok modülü ---------- */
.stk-head-btns{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
.stk-head-btns .btn-mini{ margin-left:0; }
.stk-head-btns .btn-mini:not(:first-child){ background:var(--panel); color:var(--accent); border-color:var(--accent-line); }
#stkBody{ margin-bottom:20px; }

#stkTabs .tab{ padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; color:var(--ink-dim); }
#stkBody .ct-tablewrap{ border:1px solid var(--line); border-radius:10px; max-height:none; }
.stk-b{ display:inline-block; padding:2px 9px; border-radius:6px; font-size:.76rem; font-weight:600; border:1px solid transparent; }
.stk-b.bad{ background:var(--bad-soft); color:var(--bad); border-color:var(--bad); }
.stk-b.warn{ background:var(--warn-soft); color:var(--warn); }
.stk-b.ok{ background:var(--ok-soft); color:var(--ok); }
.stk-alert{ background:var(--bad-soft); border:1px solid var(--bad); color:var(--bad); border-radius:10px; padding:12px 16px; margin:0 0 16px; font-size:.88rem; line-height:1.6; }
.ct-kpi.stk-bad{ border-top:3px solid var(--bad); } .ct-kpi.stk-bad b{ color:var(--bad); }
.stk-bar{ width:64px; height:7px; border-radius:4px; background:#E8EDF4; overflow:hidden; display:inline-block; vertical-align:middle; }
[data-theme="dark"] .stk-bar{ background:#1D2B45; }
.stk-bar i{ display:block; height:100%; border-radius:4px; background:var(--ok); }
.stk-bar i.bad,.bfill.stk-bad{ background:var(--bad); } .stk-bar i.warn,.bfill.stk-warn{ background:#C98A1B; } .bfill.stk-ok{ background:var(--ok); }
.stk-act{ white-space:nowrap; }
#stkBody .ct-table th,#stkBody .ct-table td{ padding:10px 9px; }
.stk-act button{ padding:4px 5px !important; }
.stk-act button{ border:0; background:none; color:var(--accent); font-weight:500; cursor:pointer; padding:4px 7px; border-radius:6px; }
.stk-act button:hover{ background:var(--accent-soft); } .stk-act button.del{ color:var(--bad); }

.stk-r .bval{ width:190px; }
#sbStk{ background:var(--bad) !important; color:#fff !important; }
</style>

(function(){
  const tpl = document.getElementById('staffTpl'), holder = document.createElement('div'), mark = document.createComment('staff');
  holder.appendChild(document.importNode(tpl.content, true));
  tpl.parentNode.insertBefore(mark, tpl); tpl.remove();
  const D = document, g = D.getElementById, q = D.querySelector, qa = D.querySelectorAll;
  D.getElementById = function(id){ return g.call(D, id) || holder.querySelector('#' + CSS.escape(id)); };
  D.querySelector = function(sel){ return q.call(D, sel) || holder.querySelector(sel); };
  D.querySelectorAll = function(sel){ return Array.from(qa.call(D, sel)).concat(Array.from(holder.querySelectorAll(sel))); };
  window.__staffUI = { show(){ while(holder.firstChild) mark.parentNode.insertBefore(holder.firstChild, mark); mark.remove(); delete D.getElementById; delete D.querySelector; delete D.querySelectorAll; window.__staffUI = null; } };
})();

<script>
  // theme toggle — the one eye-comfort feature
  const body = document.body;
  const eyeToggle = document.getElementById('eyeToggle');
  const eyeIcon = document.getElementById('eyeIcon');
  const eyeLabel = document.getElementById('eyeLabel');
  eyeToggle.addEventListener('click', () => {
    const isDark = body.getAttribute('data-theme') === 'dark';
    body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    eyeIcon.textContent = isDark ? '☀️' : '🌙';
    eyeLabel.textContent = isDark ? 'Göz dinlendirme' : 'Karanlık mod açık';
    try{ localStorage.setItem('posTheme', isDark ? 'light' : 'dark'); }catch(e){}
  });

  // ana gruplar: yalnızca biri açık kalır (akordeon)
  function accOpen(sec){ document.querySelectorAll('.nav-acc').forEach(a => a.classList.toggle('open', a === sec)); }
  document.querySelectorAll('.nav-acc > .nav-label').forEach(h => {
    const tg = () => { const sec = h.parentElement; if(sec.classList.contains('open')) sec.classList.remove('open'); else accOpen(sec); };
    h.addEventListener('click', tg); h.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tg(); } });
  });
  // açılır alt gruplar (durum hatırlanır)
  const FOLD_KEY = 'posFolds';
  function foldState(){ try{ return JSON.parse(localStorage.getItem(FOLD_KEY) || '{}'); }catch(e){ return {}; } }
  function foldSave(k, v){ try{ const st = foldState(); st[k] = v ? 1 : 0; localStorage.setItem(FOLD_KEY, JSON.stringify(st)); }catch(e){} }
  document.querySelectorAll('.nav-fold').forEach(f => {
    if(foldState()[f.dataset.fold]) f.classList.add('open');
    f.querySelector(':scope > .nav-item').addEventListener('click', () => { f.classList.toggle('open'); foldSave(f.dataset.fold, f.classList.contains('open')); });
  });

      h += '<div class="tg-row tg-main' + (on ? ' active' : '') + '" data-act="grp" data-gi="' + gi + '"><span class="tg-chev' + (open ? ' open' : '') + '" data-act="tog" data-gi="' + gi + '" title="Aç / kapat">▸</span>' + visHtml(gv, '', 'v-tg') + '<span class="tg-name"><b>' + esc(g.name) + '</b><small>' + g.subs.length + ' alt kategori</small></span><span class="cnt">' + nProd + '</span><span class="tg-k" data-act="kebab" data-t="grp" data-gi="' + gi + '" title="İşlemler">⋮</span></div>';
      if(open){
        h += '<div class="tg-subs">';
        g.subs.forEach(s => {
          const son = v.kind === 'cat' && v.idx[0] === s.idx;
          h += '<div class="tg-row tg-sub' + (son ? ' active' : '') + '" data-act="cat" data-i="' + s.idx + '" data-gi="' + gi + '">' + visHtml({ img: s.cat.img, icon: s.cat.icon || g.icon, name: s.label }, g.icon, 'v-s') + '<span class="tg-name"><b>' + esc(s.label) + '</b></span><span class="cnt">' + s.cat.products.length + '</span><span class="tg-k" data-act="kebab" data-t="cat" data-i="' + s.idx + '" title="İşlemler">⋮</span></div>';
        });
        h += '</div>';
      }
    });
    list.innerHTML = h;
  }

  // ---------- açılır işlem menüsü ----------
  function closePop(){ const p = mnEl('catPop'); if(p) p.style.display = 'none'; popAnchor = null; }
  function openPop(anchor, items){
    let p = mnEl('catPop'); if(!p){ p = document.createElement('div'); p.id = 'catPop'; document.body.appendChild(p); }
    if(popAnchor === anchor && p.style.display === 'block'){ closePop(); return; }
    popAnchor = anchor;
    p.innerHTML = items.map((it, i) => it.sep ? '<div class="cp-sep"></div>' : '<div class="cp-it' + (it.danger ? ' danger' : '') + '" data-i="' + i + '"><span>' + it.ic + '</span>' + esc(it.t) + '</div>').join('');
    p.style.display = 'block';
    const r = anchor.getBoundingClientRect(), w = p.offsetWidth, hh = p.offsetHeight;
    let left = r.right + 6; if(left + w > innerWidth - 8) left = Math.max(8, r.right - w);
    p.style.left = left + 'px'; p.style.top = Math.max(8, Math.min(r.top, innerHeight - hh - 8)) + 'px';
    p.onclick = e => { const it = e.target.closest('.cp-it'); if(!it) return; closePop(); items[+it.dataset.i].fn(); };
  }
  document.addEventListener('click', e => { if(!e.target.closest('#catPop') && !e.target.closest('[data-act="kebab"]')) closePop(); });
  window.addEventListener('resize', closePop);
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closePop(); });

  function groupMenu(g){
    const leaf = g.subs.length === 1 && !g.subs[0].cat.sub;
    return [
      { ic: '＋', t: 'Yeni Ürün Ekle', fn: () => openProductForm(null, g.subs[0].idx) },
      { ic: '↳', t: 'Alt Kategori Ekle', fn: () => addSub(g.name) },
      { ic: '✎', t: leaf ? 'Kategoriyi Düzenle (ad, görsel)' : 'Ana Kategoriyi Düzenle (ad, görsel)', fn: () => editGroup(g.name) },
      { ic: '⇩', t: 'Alt Kategoriye Çevir', fn: () => mainToSub(g.name) },
      { ic: '💲', t: 'Fiyatları Toplu Düzenle', fn: () => { if(leaf) selectCat(g.subs[0].idx); else selectGrp(g.name); setPriceMode(true); } },
      { sep: 1 },
      { ic: '↑', t: 'Yukarı Taşı', fn: () => moveGroup(g.name, -1) },
      { ic: '↓', t: 'Aşağı Taşı', fn: () => moveGroup(g.name, 1) },
      { sep: 1 },
      { ic: '🗑', t: leaf ? 'Kategoriyi Sil' : 'Ana Kategoriyi Sil', danger: 1, fn: () => delGroup(g.name) }
    ];
  }
  function catMenu(i){
    return [
      { ic: '＋', t: 'Yeni Ürün Ekle', fn: () => openProductForm(null, i) },
      { ic: '✎', t: 'Alt Kategoriyi Düzenle (ad, görsel)', fn: () => editCat(i) },
      ...(categories[i] && categories[i].sub ? [{ ic: '⇧', t: 'Ana Kategoriye Çevir', fn: () => subToMain(i) }] : []),
      { ic: '💲', t: 'Fiyatları Toplu Düzenle', fn: () => { selectCat(i); setPriceMode(true); } },
      { sep: 1 },
      { ic: '🗑', t: 'Alt Kategoriyi Sil', danger: 1, fn: () => delCat(i) }
    ];
  }
  mnEl('catList').addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if(!t) return;
    const act = t.dataset.act, g = lastGroups[+t.dataset.gi];
    if(act === 'tog'){ e.stopPropagation(); if(g){ openGrps.has(g.name) ? openGrps.delete(g.name) : openGrps.add(g.name); renderCatList(); } return; }
    if(act === 'kebab'){ e.stopPropagation(); if(t.dataset.t === 'grp' && g) openPop(t, groupMenu(g)); else if(t.dataset.t === 'cat') openPop(t, catMenu(+t.dataset.i)); return; }
    closePop();
    if(act === 'all') selectAll(); else if(act === 'grp' && g) selectGrp(g.name); else if(act === 'cat') selectCat(+t.dataset.i);
  });

  // ---------- kategori işlemleri ----------

  // ---------- ana ↔ alt kategori çevirme ----------
  // Alt kategoriyi ana kategoriye çevirir (ürünleri korunur; ana kategori listesinde eski ana kategorisinin hemen altına girer)
  function subToMain(i){
    const c = categories[i]; if(!c || !c.sub) return;
    const from = grpName(c), nm = c.sub, low = x => String(x).toLocaleLowerCase('tr-TR');
    if(menuGroups(categories).some(g => low(g.name) === low(nm))){ showToast('“' + nm + '” adında bir ana kategori zaten var. Önce alt kategorinin adını değiştirin.'); return; }
    c.name = nm; c.grp = nm; c.sub = ''; c.gv = 3;
    const gs = menuGroups(categories), ni = gs.findIndex(g => g.name === nm);
    if(ni >= 0){ const x = gs.splice(ni, 1)[0], at = gs.findIndex(g => g.name === from); gs.splice(at >= 0 ? at + 1 : gs.length, 0, x); }
    gs.forEach((g, k) => gmSet(g.name, { ord: k }));
    if(!categories.some(x => x !== c && grpName(x) === from)){ groupMeta = groupMeta.filter(m => m.name !== from); openGrps.delete(from); }
    showAllProds = false; activeGrp = null; activeCatIndex = i; openGrps.add(nm);
    menuRender(); saveState(); showToast('“' + nm + '” artık ana kategori.');
  }
  // Ana kategoriyi (alt kategorileriyle birlikte) başka bir ana kategorinin altına alt kategori olarak taşır
  function mainToSub(gname){
    const all = menuGroups(categories), g = all.find(x => x.name === gname); if(!g) return;
    const others = all.filter(x => x.name !== gname);
    if(!others.length){ showToast('Alt kategoriye çevirmek için başka bir ana kategori olmalı.'); return; }
    const low = x => String(x).toLocaleLowerCase('tr-TR'), nProd = g.subs.reduce((n, s) => n + s.cat.products.length, 0);
    openForm({
      title: 'Alt Kategoriye Çevir',
      sub: '“' + gname + '” (' + nProd + ' ürün) seçeceğiniz ana kategorinin içine alt kategori olarak taşınır. Ürünler silinmez.' + (g.subs.length > 1 ? ' İçindeki ' + g.subs.length + ' alt kategori de aynı ana kategorinin altına geçer.' : ''),
      fields: [{ id: 'to', label: 'Hangi ana kategorinin altına eklensin?', type: 'select', options: others.map(x => ({ v: x.name, t: x.name })), value: others[0].name }],
      okText: 'Çevir',
      onOk(v){
        const to = v.to; if(!others.some(x => x.name === to)) return 'Geçerli bir ana kategori seçin.';
        const used = new Set(categories.filter(c => grpName(c) === to).map(c => low(c.sub || c.name)));
        g.subs.map(s => s.cat).forEach(c => {
          let label = c.sub || gname; if(used.has(low(label))) label = label + ' (' + gname + ')';
          used.add(low(label));
          if(!c.sub){ if(!c.img && g.img) c.img = g.img; if(!c.icon && g.icon) c.icon = g.icon; }
          c.grp = to; c.sub = label; c.gv = 3;
        });
        groupMeta = groupMeta.filter(m => m.name !== gname); openGrps.delete(gname); openGrps.add(to);
        showAllProds = false; activeGrp = null; activeCatIndex = categories.indexOf(g.subs[0].cat);
        menuRender(); saveState(); showToast('“' + gname + '” artık “' + to + '” altında alt kategori.');
      }
    });
  }
  function renameGroup(old, nw){
    menuGroups(categories).forEach((g, i) => gmSet(g.name, { ord: i }));   // mevcut sırayı sabitle
    categories.forEach(c => { if(grpName(c) === old) c.grp = nw; });
    const m = groupMeta.find(x => x.name === old); if(m) m.name = nw;
  }
  function moveGroup(name, d){
    const gs = menuGroups(categories), i = gs.findIndex(g => g.name === name), j = i + d;
    if(i < 0 || j < 0 || j >= gs.length) return;
    const t = gs[i]; gs[i] = gs[j]; gs[j] = t;
    gs.forEach((g, k) => gmSet(g.name, { ord: k }));
    menuRender(); saveState();
  }
  function addGroup(){
    openForm({
      title: 'Ana Kategori Ekle', sub: 'Menünün üstünde görsel + isimle görünen ana sekmedir. Alt kategorileri sonra ekleyebilirsiniz.',
      fields: [
        { id: 'name', label: 'Ana kategori adı', value: '' },
        { id: 'imgf', label: 'Ana kategori görseli (yükle)', type: 'file', value: '', icon: '', name: '' },
        { id: 'icon', label: 'İkon (emoji) — görsel yoksa bu görünür', value: '' }
      ],
      onOk(v){
        if(!v.name) return 'Ana kategori adı gerekli.';
        if(menuGroups(categories).some(g => g.name.toLocaleLowerCase('tr-TR') === v.name.toLocaleLowerCase('tr-TR'))) return 'Bu adda bir ana kategori zaten var.';
        categories.push({ name: v.name, grp: v.name, sub: '', gv: 2, icon: v.icon, img: v.imgf || '', products: [] });
        gmSet(v.name, { icon: v.icon, img: v.imgf || '' }); try{ imgQueue('grp', v.name); }catch(e){}
        showAllProds = false; activeGrp = null; activeCatIndex = categories.length - 1; openGrps.add(v.name);
        menuRender(); saveState(); showToast('Ana kategori eklendi: ' + v.name);
      }
    });
  }
  function addSub(gname){
    openForm({
      title: 'Alt Kategori Ekle', sub: '“' + gname + '” ana kategorisinin içine eklenir.',
      fields: [
        { id: 'name', label: 'Alt kategori adı', value: '' },
        { id: 'imgf', label: 'Görsel (isteğe bağlı)', type: 'file', value: '', icon: '', name: '' },
        { id: 'icon', label: 'İkon (emoji, isteğe bağlı)', value: '' }
      ],
      onOk(v){
        if(!v.name) return 'Alt kategori adı gerekli.';
        if(categories.some(c => grpName(c) === gname && (c.sub || c.name).toLocaleLowerCase('tr-TR') === v.name.toLocaleLowerCase('tr-TR'))) return 'Bu ana kategoride aynı adlı bir alt kategori var.';
        migrateMenuGroups(categories);
        const gix = grpIdx(gname), c0 = categories[gix[0]];
        if(gix.length === 1 && c0 && !c0.sub && !c0.products.length){   // boş, alt kategorisiz ana kategori: ilk alt kategoriye dönüşür (gereksiz tekrar satır oluşmasın)
          gmSet(gname, { icon: groupMeta.some(m => m.name === gname && m.icon) ? undefined : c0.icon, img: groupMeta.some(m => m.name === gname && m.img) ? undefined : c0.img });
          Object.keys(groupMeta.find(m => m.name === gname) || {}).forEach(k => { const m = groupMeta.find(x => x.name === gname); if(m[k] === undefined) delete m[k]; });
          Object.assign(c0, { name: gname + ' / ' + v.name, sub: v.name, gv: 2, icon: v.icon, img: v.imgf || '' }); activeCatIndex = gix[0];
        } else { categories.push({ name: gname + ' / ' + v.name, grp: gname, sub: v.name, gv: 2, icon: v.icon, img: v.imgf || '', products: [] }); activeCatIndex = categories.length - 1; }
        showAllProds = false; activeGrp = null; openGrps.add(gname); try{ imgQueue('cat', categories[activeCatIndex]); }catch(e){}
        menuRender(); saveState(); showToast('Alt kategori eklendi: ' + v.name);
      }
    });
  }
  function deptField(n, what){ return { id: 'dept', label: 'Toplu departman (' + what + ' ' + n + ' ürünün hepsi için)', type: 'select', options: [{ v: '', t: '— Değiştirme —' }].concat(mutfakGruplari.map(x => ({ v: x.name, t: x.name }))), value: '' }; }
  function editGroup(gname){
    const g = menuGroups(categories).find(x => x.name === gname); if(!g) return;
    const cats = g.subs.map(s => s.cat), plain = cats.filter(c => !c.sub), nProd = cats.reduce((n, c) => n + c.products.length, 0);
    const leaf = g.subs.length === 1 && !g.subs[0].cat.sub;
    openForm({
      title: leaf ? 'Kategoriyi Düzenle' : 'Ana Kategoriyi Düzenle',
      sub: 'Ana kategori, müşteri menüsünde ve sipariş ekranında üstteki görselli sekmedir.',
      fields: [
        { id: 'name', label: 'Ana kategori adı', value: g.name },
        { id: 'imgf', label: 'Ana kategori görseli (yükle)', type: 'file', value: /^data:/.test(g.img || '') ? g.img : '', icon: g.icon, name: g.name },
        { id: 'img', label: 'veya görsel bağlantısı (link yapıştır)', placeholder: 'https://...', value: /^https:/.test(g.img || '') ? g.img : '' },
        { id: 'icon', label: 'İkon (emoji) — görsel yoksa bu görünür', value: g.icon || '' },
        deptField(nProd, 'bu ana kategorideki')
      ],
      onOk(v){
        if(!v.name) return 'Ana kategori adı gerekli.';
        if(v.name !== g.name && menuGroups(categories).some(x => x.name.toLocaleLowerCase('tr-TR') === v.name.toLocaleLowerCase('tr-TR'))) return 'Bu adda bir ana kategori zaten var.';
        const lnk = normImgUrl(v.img); if(lnk === null) return 'Görsel adresi geçerli bir bağlantı olmalı (https://...).';
        const nm = v.name, img = v.imgf || lnk;
        if(nm !== g.name){
          plain.forEach(c => { if(c.name === g.name) c.name = nm; });
          renameGroup(g.name, nm); openGrps.delete(g.name); openGrps.add(nm);
          if(activeGrp === g.name) activeGrp = nm;
        }
        gmSet(nm, { icon: v.icon, img });
        plain.forEach(c => { c.icon = v.icon; c.img = img; }); try{ imgQueue('grp', nm); }catch(e){}
        let moved = 0; if(v.dept) cats.forEach(c => c.products.forEach(pr => { pr.kg = v.dept; moved++; }));
        menuRender(); saveState();
        showToast(moved ? moved + ' ürün “' + v.dept + '” departmanına bağlandı.' : 'Ana kategori güncellendi.');
      }
    });
  }
  function editCat(i){
    const c = categories[i]; if(!c) return;
    openForm({
      title: 'Alt Kategoriyi Düzenle', sub: catLabel(c),
      fields: [
        { id: 'name', label: 'Alt kategori adı', value: c.sub || c.name },
        { id: 'imgf', label: 'Alt kategori görseli (yükle)', type: 'file', value: /^data:/.test(c.img || '') ? c.img : '', icon: c.icon, name: c.sub || c.name },
        { id: 'img', label: 'veya görsel bağlantısı (link yapıştır)', placeholder: 'https://...', value: /^https:/.test(c.img || '') ? c.img : '' },
        { id: 'icon', label: 'İkon (emoji) — görsel yoksa bu görünür', value: c.icon || '' },
        deptField(c.products.length, 'kategorideki')
      ],
      onOk(v){
        if(!v.name) return 'Alt kategori adı gerekli.';
        const lnk = normImgUrl(v.img); if(lnk === null) return 'Görsel adresi geçerli bir bağlantı olmalı (https://...).';
        if(c.sub) c.sub = v.name; else c.name = v.name;
        c.icon = v.icon; c.img = v.imgf || lnk; try{ imgQueue('cat', c); }catch(e){}
        let moved = 0; if(v.dept) c.products.forEach(pr => { pr.kg = v.dept; moved++; });
        menuRender(); saveState();
        showToast(moved ? moved + ' ürün “' + v.dept + '” departmanına bağlandı.' : 'Alt kategori güncellendi.');
      }
    });
  }
  async function delCat(i){
    const c = categories[i]; if(!c) return;
    if(categories.length <= 1){ showToast('En az bir kategori kalmalı.'); return; }
    const n = c.products.length;
    if(!await uiConfirm('“' + catLabel(c) + '” alt kategorisi' + (n ? ' ve içindeki ' + n + ' ürün' : '') + ' silinsin mi? Bu işlem geri alınamaz.')) return;
    c.products.forEach(p => priceDraft.delete(p.name));
    categories.splice(i, 1); if(i < activeCatIndex) activeCatIndex--;
    menuRender(); saveState(); showToast('Alt kategori silindi.');
  }
  async function delGroup(name){
    const ix = grpIdx(name), n = ix.reduce((s, i) => s + categories[i].products.length, 0);
    if(categories.length - ix.length < 1){ showToast('En az bir kategori kalmalı.'); return; }
    if(!await uiConfirm('“' + name + '” ana kategorisi' + (ix.length > 1 ? ', ' + ix.length + ' alt kategorisi' : '') + (n ? ' ve toplam ' + n + ' ürünle birlikte' : '') + ' silinsin mi? Bu işlem geri alınamaz.')) return;
    ix.forEach(i => categories[i].products.forEach(p => priceDraft.delete(p.name)));
    categories = categories.filter(c => grpName(c) !== name);
    groupMeta = groupMeta.filter(m => m.name !== name);
    openGrps.delete(name); activeGrp = null; activeCatIndex = 0;
    menuRender(); saveState(); showToast('Ana kategori silindi.');
  }

  // ---------- üst başlık (seçili ana / alt kategori) ----------
  function renderHead(){
    const el = mnEl('menuHead'); if(!el) return;
    const v = curView(), gs = menuGroups(categories), idxs = viewIdxs();
    let lvl, lvlTxt, title, crumb = '', obj, edit = null, canSub = null, subN = 0, conv = null;
    if(v.kind === 'all'){ lvl = 'all'; lvlTxt = 'Genel görünüm'; title = 'Tüm Ürünler'; obj = { name: title, icon: '📋', img: '' }; }
    else if(v.kind === 'grp'){ const g = gs.find(x => x.name === v.grp) || { name: v.grp, icon: '', img: '', subs: [] }; lvl = 'main'; lvlTxt = 'Ana kategori'; title = g.name; subN = g.subs.length; obj = { name: g.name, icon: g.icon, img: g.img }; edit = () => editGroup(g.name); canSub = g.name; if(gs.length > 1) conv = { t: '⇩ Alt Kategoriye Çevir', fn: () => mainToSub(g.name) }; }
    else {
      const c = categories[v.idx[0]], gn = grpName(c), g = gs.find(x => x.name === gn) || { name: gn, icon: '', img: '' }, leaf = !c.sub && grpIdx(gn).length === 1;
      if(leaf){ lvl = 'main'; lvlTxt = 'Ana kategori'; title = g.name; obj = { name: g.name, icon: g.icon, img: g.img }; edit = () => editGroup(g.name); canSub = g.name; if(gs.length > 1) conv = { t: '⇩ Alt Kategoriye Çevir', fn: () => mainToSub(g.name) }; }
      else { lvl = 'sub'; lvlTxt = 'Alt kategori'; crumb = gn; title = c.sub || c.name; obj = { name: title, icon: c.icon || g.icon, img: c.img }; const ci = v.idx[0]; edit = () => editCat(ci); conv = { t: '⇧ Ana Kategoriye Çevir', fn: () => subToMain(ci) }; }
    }
    const prices = idxs.flatMap(i => categories[i].products.map(p => p.price)), n = prices.length, st = [];
    if(subN) st.push('<span><b>' + subN + '</b> alt kategori</span>');
    if(n){ st.push('<span><b>' + n + '</b> ürün</span>', '<span>Ort. <b>' + fmtP(prices.reduce((a, b) => a + b, 0) / n) + '</b></span>', '<span><b>' + fmtP(Math.min.apply(null, prices)) + '</b> – <b>' + fmtP(Math.max.apply(null, prices)) + '</b></span>'); }
    else st.push('<span>Henüz ürün yok</span>');
    headCtx = { edit, canSub, conv, ci: v.kind === 'cat' ? v.idx[0] : (idxs[0] != null ? idxs[0] : activeCatIndex) };
    el.innerHTML =
      '<div class="mh-thumb" data-act="editself"' + (edit ? ' title="Görseli / adı değiştir"' : '') + '>' + visHtml(obj, '', 'v-mh') + (edit ? '<span class="mh-edit">✎</span>' : '') + '</div>' +
      '<div class="mh-txt"><div class="mh-top"><span class="lvl lvl-' + lvl + '">' + lvlTxt + '</span>' + (crumb ? '<span class="mh-crumb">' + esc(crumb) + ' ›</span>' : '') + '</div><h2>' + esc(title) + '</h2><div class="mh-stats">' + st.join('') + '</div></div>' +
      '<div class="mh-actions"><button type="button" class="mbtn pri" data-act="newprod">＋ Yeni Ürün</button>' +
      (canSub ? '<button type="button" class="mbtn" data-act="newsub">↳ Alt Kategori Ekle</button>' : '') +
      (edit ? '<button type="button" class="mbtn" data-act="editself">✎ ' + (lvl === 'main' ? 'Ana Kategoriyi Düzenle' : 'Alt Kategoriyi Düzenle') + '</button>' : '') +
      (conv ? '<button type="button" class="mbtn" data-act="conv">' + conv.t + '</button>' : '') + '</div>';
  }
  mnEl('menuHead').addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if(!t) return;
    if(t.dataset.act === 'newprod') openProductForm(null, headCtx.ci);
    else if(t.dataset.act === 'newsub' && headCtx.canSub) addSub(headCtx.canSub);
    else if(t.dataset.act === 'editself' && headCtx.edit) headCtx.edit();
    else if(t.dataset.act === 'conv' && headCtx.conv) headCtx.conv.fn();
  });

  // ---------- ürün listesi + toplu fiyat düzenleme ----------
  const draftOf = p => priceDraft.has(p.name) ? priceDraft.get(p.name) : null;
  function setDraft(p, val){
    if(val == null || !isFinite(val) || val < 0){ priceDraft.delete(p.name); return; }
    val = Math.round(val * 100) / 100;
    if(Math.abs(val - p.price) < 0.005) priceDraft.delete(p.name); else priceDraft.set(p.name, val);

  function paletteColor(i){
    const palette = ['#1F4B8F','#0F7B8A','#B7791F','#5B6B82','#3E6FB5','#2E8B6E','#8A5A9E','#9A4A3C','#4F7F9C','#7A8798','#6B7F3A'];
    return palette[i % palette.length];
  }

  function buildLineChart(xLabels, yMax, yStep, opts){
    opts = opts || {};
    const w = 760, h = 220, padL = 40, padR = 12, padT = 10, padB = 26;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    const n = xLabels.length;
    const stepX = n > 1 ? plotW / (n - 1) : 0;
    const yZero = padT + plotH;
    let grid = '', ylabels = '';
    const steps = Math.round(yMax / yStep);
    for(let s = 0; s <= steps; s++){
      const val = s * yStep;
      const y = padT + plotH - (val / yMax) * plotH;
      grid += '<line class="grid-line" x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '"/>';
      ylabels += '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" font-size="11" text-anchor="end">' + val.toFixed(2) + '</text>';
    }
    let dots = '', xlabels = '', pts = '';
    for(let i = 0; i < n; i++){
      const x = padL + i * stepX;
      const yy = (opts.values && opts.values[i] != null) ? padT + plotH - Math.min(opts.values[i] / yMax, 1) * plotH : yZero;
      pts += x + ',' + yy + ' ';
      if(opts.dots){ dots += '<circle cx="' + x + '" cy="' + yy + '" r="3" fill="' + paletteColor(i) + '"/>'; }
      const color = (opts.xColors && opts.xColors[i]) ? opts.xColors[i] : 'var(--ink-faint)';
      xlabels += '<text x="' + x + '" y="' + (h - 6) + '" font-size="10" text-anchor="middle" fill="' + color + '">' + xLabels[i] + '</text>';
    }
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block;">' +
      grid +
      '<polyline points="' + pts + '" fill="none" stroke="var(--red)" stroke-width="2" opacity="0.55"/>' +
      dots + ylabels + xlabels +
      '</svg>';
  }

  function niceStep(x){ const e = Math.pow(10, Math.floor(Math.log10(x))), f = x / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; }

    const mx = Math.max.apply(null, vals), step = mx > 0 ? niceStep(mx / 4) : 0.5;
    document.getElementById('dailySalesChart').innerHTML = buildLineChart(hours, step * 4, step, { dots: true, values: vals });

  const FIREBASE_ADMIN_EMAIL = APP_CONFIG.adminEmail || ''; // yalnızca bu Firebase hesabı menüyü yayınlar ve personel dizinini yazar
  const FIREBASE_CONFIG = APP_CONFIG.firebase || {};

  const LocalRT = (() => {
    const K = 'posRT', L = [];
    const rd = () => { try{ return JSON.parse(localStorage.getItem(K)) || {}; }catch(e){ return {}; } };
    const get = (t, p) => { const v = p.split('/').filter(Boolean).reduce((o, k) => (o == null ? o : o[k]), t); return v === undefined ? null : v; };
    const fire = () => { const t = rd(); L.forEach(l => l.cb(get(t, l.p))); };
    const put = (p, v) => {
      const t = rd(), ks = p.split('/').filter(Boolean); let o = t;
      ks.slice(0, -1).forEach(k => { o = o[k] = o[k] || {}; });
      if(v === null) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = v;
      localStorage.setItem(K, JSON.stringify(t)); fire();
    };
    window.addEventListener('storage', e => { if(e.key === window.__nsk(K)) fire(); });
    return {
      local: true,
      set: (p, v) => put(p, v),
      push: (p, v) => { const id = 'o' + Date.now() + Math.random().toString(36).slice(2, 6); put(p + '/' + id, v); return id; },
      remove: p => put(p, null),
      get: p => Promise.resolve(get(rd(), p)),
      on: (p, cb) => { L.push({ p, cb }); cb(get(rd(), p)); }
    };
  })();
  let RT = LocalRT;

  async function initRT(){
    const c = FIREBASE_CONFIG;
    if(!c.apiKey || !c.databaseURL) return;
    try{
      const B = 'https://www.gstatic.com/firebasejs/11.10.0/'; window.__fbB = B;
      const { initializeApp } = await import(B + 'firebase-app.js');
      const { getDatabase, ref, set, push, onValue, remove, get } = await import(B + 'firebase-database.js');
      const { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword, updatePassword, reauthenticateWithCredential, EmailAuthProvider } = await import(B + 'firebase-auth.js');
      const app = initializeApp(c), db = getDatabase(app), auth = getAuth(app); window.__fbApp = app;
      if(auth.authStateReady) await auth.authStateReady();
      if(!auth.currentUser) await signInAnonymously(auth);
      const AUTH_MSG = { 'auth/invalid-credential': 'E-posta veya şifre hatalı.', 'auth/wrong-password': 'Şifre hatalı.', 'auth/user-not-found': 'Bu e-posta ile hesap yok.', 'auth/invalid-email': 'E-posta biçimi geçersiz.', 'auth/too-many-requests': 'Çok fazla deneme. Biraz bekleyin.', 'auth/network-request-failed': 'İnternet bağlantısı yok.', 'auth/operation-not-allowed': 'Firebase’de E-posta/Şifre girişi açık değil.' };
      const _rtSeen = {};
      const rtErr = (op, p, e) => { const c = (e && e.code) || 'hata'; console.error('Firebase ' + op + ' hatası (' + p + '):', c); const k = op + p + c; if(_rtSeen[k] && Date.now() - _rtSeen[k] < 60000) return; _rtSeen[k] = Date.now();
        try{ showToast('⚠ Senkron ' + op + ' hatası: ' + p.split('/')[0] + ' (' + c + ')' + (/permission/i.test(c) ? ' — bu cihaz Firebase personel hesabıyla bağlı değil veya kurallar eşleşmiyor' : '')); }catch(_){} };
      const isAdminAcc = () => !!(auth.currentUser && !auth.currentUser.isAnonymous && (auth.currentUser.email || '').toLowerCase() === FIREBASE_ADMIN_EMAIL.toLowerCase());
      let ownerUid = null;   // Yönetici (işletme sahibi) hesabının uid'si; yalnızca giriş/oturum geri yükleme sırasında işaretlenir
      const isOwnerAcc = () => !!(ownerUid && auth.currentUser && !auth.currentUser.isAnonymous && auth.currentUser.uid === ownerUid);
      const isAdminAny = () => isAdminAcc() || isOwnerAcc();
      const staffAuth = async (needAdmin) => {
        if(auth.currentUser && !auth.currentUser.isAnonymous){
          if(!needAdmin || isAdminAny()) return true;
          try{ await signOut(auth); await signInAnonymously(auth); }catch(e){}
        }
        let err = needAdmin ? 'Devam etmek için Firebase hesabını girin.' : '';
        for(;;){
          const c = await askCred(err); if(!c) return false;
          try{
            await signInWithEmailAndPassword(auth, c.em, c.pw);
            if(needAdmin && !isAdminAcc()){ err = 'Bu hesap yönetici hesabı değil.'; try{ await signOut(auth); await signInAnonymously(auth); }catch(e){} continue; }
            return true;
          }catch(e){ err = AUTH_MSG[e.code] || ('Giriş başarısız: ' + e.code); }
        }
      };
      // ---- isim + şifre ile personel girişi (sentetik e-posta; personel e-postayı görmez) ----
      const uid = () => (auth.currentUser && !auth.currentUser.isAnonymous) ? auth.currentUser.uid : null;
      const toAnon = async () => { ownerUid = null; try{ await signOut(auth); await signInAnonymously(auth); }catch(e){} };
      const staffLogin = async (name, pw) => {
        const n = normName(name); if(!n) return { code: 'bad', known: false };
        let v = 1, known = false;
        try{ const x = await get(ref(db, 'staffVer/' + n)).then(s => s.val()); if(+x >= 1){ v = +x; known = true; } }catch(e){}
        try{
          const cr = await signInWithEmailAndPassword(auth, staffEmail(n, v), pw);
          let role = null; try{ role = await get(ref(db, 'staffRoles/' + cr.user.uid)).then(s => s.val()); }catch(e){}
          if(!role || !role.ad){ await toAnon(); return { code: 'bad', known: true }; }
          if(role.blocked === true){ await toAnon(); return { code: 'blocked' }; }
          ownerUid = role.owner === true ? cr.user.uid : null;
          return { code: 'ok', uid: cr.user.uid, role };
        }catch(e){
          const c = (e && e.code) || '';
          if(c === 'auth/too-many-requests') return { code: 'limit' };
          if(c === 'auth/network-request-failed') return { code: 'net' };
          return { code: 'bad', known };
        }
      };
      const staffLogout = () => toAnon();
      const changePassword = async (oldPw, newPw) => {
        const u = auth.currentUser; if(!u || u.isAnonymous || !u.email) return { code: 'bad' };
        try{ await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, oldPw)); }
        catch(e){ const c = (e && e.code) || ''; return { code: c === 'auth/too-many-requests' ? 'limit' : c === 'auth/network-request-failed' ? 'net' : 'wrong' }; }
        try{ await updatePassword(u, newPw); return { code: 'ok' }; }
        catch(e){ return { code: (e && e.code) === 'auth/weak-password' ? 'weak' : 'err' }; }
      };
      let secApp = null;
      const createStaff = async (email, pw) => {
        if(!secApp) secApp = initializeApp(c, 'posSec');
        const a = getAuth(secApp);
        try{ const cr = await createUserWithEmailAndPassword(a, email, pw); return cr.user.uid; }
        finally{ try{ await signOut(a); }catch(_){} }
      };
      const clean = v => (v === null ? null : JSON.parse(JSON.stringify(v)));
      RT = {
        local: false, staffAuth, isAdmin: isAdminAny, isRoot: isAdminAcc, changePassword, setOwner: u => { ownerUid = u || null; }, uid, staffLogin, staffLogout, createStaff,
        set: (p, v) => set(ref(db, p), clean(v)).catch(e => { rtErr('yazma', p, e); throw e; }),
        push: (p, v) => { const r = push(ref(db, p)); set(r, clean(v)).catch(e => rtErr('yazma', p, e)); return r.key; },
        remove: p => remove(ref(db, p)).catch(e => { rtErr('silme', p, e); throw e; }),
        get: p => get(ref(db, p)).then(s => s.val()),
        on: (p, cb) => onValue(ref(db, p), s => cb(s.val()), err => rtErr('okuma', p, err))
      };
    }catch(e){ console.error('Firebase başlatılamadı, yerel moda geçildi:', e); RT = LocalRT; }
  }

  // anahtarlı DOM önbelleği: kategori değişince / sepete ekleyince kartlar ve görseller yeniden oluşturulmaz (titreme ve görsel yeniden belirme biter)
  const _kc = {};
  function keyed(name, container, entries, act){
    const cache = _kc[name] || (_kc[name] = new Map());
    const nodes = entries.map(e => {
      let c = cache.get(e.key);
      if(!c || c.html !== e.html){ const t = document.createElement('template'); t.innerHTML = e.html; c = { html: e.html, node: t.content.firstElementChild }; cache.set(e.key, c); }
      if(act) act(c.node, e); return c.node;
    });
    nodes.forEach((n, i) => { if(container.children[i] !== n) container.insertBefore(n, container.children[i] || null); });

  }

  // ---- parola özeti (SHA-256, tarayıcıdan bağımsız) ----
  const SHA_K = [], SHA_H0 = [];

        const t2 = ((((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10))) + ((a & b2) ^ (a & c) ^ (b2 & c))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b2; b2 = a; a = (t1 + t2) | 0;
      }

    if(isHash(settings.pin)) dir[settings.pin] = { ad: 'Yönetici', gorev: 'Müdür', bolge: '', tel: '', email: '', blocked: false, admin: true };
    if(isHash(settings.supPin)) dir[settings.supPin] = { ad: 'Admin', gorev: 'Müdür', bolge: '', tel: '', email: '', blocked: false, admin: true, sup: true };
    return dir;

    if(RT.local || !dirReady || !(curUser && curUser.admin) || (RT.isRoot && !RT.isRoot())) return;

      const cur = await RT.get('staffDir'), vals = Object.values(dir);

      Object.keys(cur || {}).forEach(h => { const e = cur[h]; if(!e || dir[h]) return; if(e.sup && !hasSup) dir[h] = e; else if(e.admin && !e.sup && !hasOwn) dir[h] = e; });

    });

        const adm = Object.keys(d).find(h => d[h] && d[h].admin && !d[h].sup); if(adm && (!isHash(settings.pin) || (curUser && curUser.sup))) settings.pin = adm;

  // ---- giriş / çıkış ----
  let loginFails = 0, loginLockUntil = 0, loginBusy = false;
  const LOGIN_GEN = 'İsim veya şifre hatalı.';
  async function tryLogin(){
    if(loginBusy) return;
    const now = Date.now(), err = $id('loginErr');
    if(now < loginLockUntil){ err.textContent = 'Çok fazla hatalı deneme. ' + Math.ceil((loginLockUntil - now) / 1000) + ' sn bekleyin.'; return; }
    const pw = $id('loginPass').value; if(!pw) return;
    let nm = $id('loginName') ? $id('loginName').value.trim() : '', nmN = normName(nm); const adminTry = !nmN || nmN === 'yonetici', supTry = nmN === 'admin';
    loginBusy = true; err.textContent = '';

      let user = null, remoteErr = false, ownerExists = false;
      if(!RT.local){ try{ ownerExists = (await RT.get('staffVer/yonetici')) != null; }catch(e){} if(ownerExists && !nmN){ nm = 'Yönetici'; nmN = 'yonetici'; } }

        const u = staffUsers.find(x => !x.blocked && mt(x));
        if(u){ if(u.sifre){ u.h = pwHash(pw); delete u.sifre; } user = { ad: u.ad, gorev: u.gorev, bolge: u.bolge || '', admin: false, h: u.h }; }
        else if(staffUsers.some(x => x.blocked && mt(x))){ err.textContent = 'Bu kullanıcının girişi engellenmiş.'; return; }
      } else {
        let legacyOn = false; try{ legacyOn = (await RT.get('staffMeta/legacyOn')) === true; }catch(e){}
        let known = false;
        // 1) yeni yol: isim + şifre -> kişiye özel Firebase hesabı
        if(nmN && RT.staffLogin){
          err.textContent = 'Kontrol ediliyor…';
          const r = await RT.staffLogin(nm, pw.trim()); err.textContent = '';
          if(r.code === 'ok') user = { ad: r.role.ad, gorev: r.role.gorev, bolge: r.role.bolge || '', admin: r.role.owner === true, owner: r.role.owner === true, uid: r.uid };
          else if(r.code === 'blocked'){ err.textContent = 'Bu kullanıcının girişi engellenmiş.'; return; }

          else if(r.code === 'net'){ err.textContent = 'İnternet bağlantısı yok.'; return; }
          else known = !!r.known;

        // 2) eski yol (geçiş dönemi): yalnızca şifresi henüz taşınmamış kişiler ve yönetici PIN doğrulaması
        if(!user && nmN && !(ownerExists && nmN === 'yonetici') && (nmN === 'yonetici' || nmN === 'admin' || (legacyOn && !known))){
          const hh = pwHash(pw), mt = x => !x.uid && (!nmN || normName(x.ad) === nmN) && ((x.h && x.h === hh) || (x.sifre && x.sifre === pw));
          const u = legacyOn ? staffUsers.find(x => !x.blocked && mt(x)) : null;
          if(u){ if(u.sifre){ u.h = pwHash(pw); delete u.sifre; } user = { ad: u.ad, gorev: u.gorev, bolge: u.bolge || '', admin: false, h: u.h }; }
          else if(legacyOn && staffUsers.some(x => x.blocked && mt(x))){ err.textContent = 'Bu kullanıcının girişi engellenmiş.'; return; }

              else if(r.admin){ if(adminTry){ settings.pin = r.h; user = { ad: 'Yönetici', gorev: 'Müdür', admin: true }; } }

  $id('ppMethods').addEventListener('click', e => {

    const method = btn.getAttribute('data-method'), amount = payAmount(); if(!amount) return;
    if(method === 'Açık Hesap'){
      const cs = customers.filter(c => c.acikHesap);

      openForm({ title: 'Açık Hesaba Yaz — ' + money(amount), fields: [{ id: 'c', label: 'Müşteri', type: 'select', options: cs.map(c => ({ v: c.no, t: c.name + ' (bakiye ' + money(c.balance) + ')' })) }],
        onOk(v){ const c = customers.find(x => x.no === +v.c); if(!c) return 'Müşteri seçin.'; c.balance = Math.round((c.balance + amount) * 100) / 100; settle('Açık Hesap', amount, { label: 'Açık Hesap · ' + c.name }); } });

  function payAmount(){
    const key = currentCartKey, remaining = remainingForKey(key); if(remaining <= 0) return 0;
    let amount = parseFloat(String($id('ppAmountInput').value).replace(',', '.'));
    if(!(amount > 0)){ showToast('Geçerli bir tutar girin.'); return 0; }
    return Math.round(Math.min(amount, remaining) * 100) / 100;
  }
  function settle(method, amount, o){
    const key = currentCartKey, title = orderLabel(key);
    paidByKey[key] = Math.round(((paidByKey[key] || 0) + amount) * 100) / 100;
    (paymentHistoryByKey[key] = paymentHistoryByKey[key] || []).push({ method: o.label || method, amount, waive: !!o.waive });
    if(o.waive) logPriv('waiveLog', { ts: Date.now(), amount, reason: o.reason, label: title, user: uname() });
    else logPriv('payLog', { ts: Date.now(), amount, method, label: title, user: uname() });
    const nr = remainingForKey(key);
    if(nr <= 0.005) finalizeOrder(key, (o.waive ? 'İkram' : method) + ' ile ' + money(amount) + ' — ödeme tamamlandı.');
    else { updateHomeStats(); renderGunSonu(); renderOrderLines(); renderPaymentPanel(); showToast((o.waive ? 'İkram' : method) + ' ile ' + money(amount) + ' işlendi. Kalan: ' + money(nr)); }
    saveState();
  }

  const fbErr = e => ({ 'auth/weak-password': 'Şifre en az 6 karakter olmalı (Firebase şartı).', 'auth/operation-not-allowed': 'Firebase’de E-posta/Şifre girişi kapalı.', 'auth/network-request-failed': 'İnternet bağlantısı yok.', 'auth/invalid-email': 'İsim e-postaya çevrilemedi, farklı bir isim deneyin.', 'auth/too-many-requests': 'Çok fazla deneme, biraz bekleyin.' }[(e && e.code) || ''] || ('Hata: ' + ((e && e.code) || (e && e.message) || 'bilinmiyor')));
  async function fbCreateStaff(u, pw){
    if(!(RT.isAdmin && RT.isAdmin()) || !RT.createStaff){ showToast('Önce yönetici Firebase hesabıyla bağlanın (yönetici olarak çıkış-giriş yapıp Firebase hesabını girin).'); return false; }
    const n = normName(u.ad); if(!n){ showToast('İsim en az bir harf veya rakam içermeli.'); return false; }
    let cur = 0; try{ cur = +(await RT.get('staffVer/' + n)) || 0; }catch(e){ showToast('Firebase okunamadı: ' + fbErr(e)); return false; }
    let v = cur + 1, nid = null, tries = 0;

  function csvParse(text){

    const rows = []; let row = [], cur = '', q = false;
    for(let k = 0; k < text.length; k++){
      const ch = text[k];
      if(q){ if(ch === '"'){ if(text[k + 1] === '"'){ cur += '"'; k++; } else q = false; } else cur += ch; }
      else if(ch === '"') q = true;
      else if(ch === d){ row.push(cur); cur = ''; }
      else if(ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
      else if(ch !== '\r') cur += ch;
    }

    return rows.filter(r => r.some(c => c !== ''));
  }

    function tone(v){
      const c = unlock(); if(!c) return;

        const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + d;

    }
    function tick(){ tone(vol); try{ if(navigator.vibrate) navigator.vibrate([250, 120, 250]); }catch(e){} vol = Math.max(MIN, vol * STEP); }
    function set(n){
      if(n > 0){
        if(!timer){ vol = 1; tick(); timer = setInterval(tick, EVERY); }
